<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Michael Al Kurdi</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #16181d; --muted: #5d6270;
  --line: #e2e0da; --accent: #1f4fd6; --accent-ink: #ffffff; --ring: #1f4fd6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #171a21; --ink: #eef0f4; --muted: #a0a6b3;
    --line: #2a2f3a; --accent: #7aa2ff; --accent-ink: #0b0d12; --ring: #7aa2ff;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; justify-content: center;
  padding: max(40px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 420px; }
header { text-align: center; margin-bottom: 28px; }
.mark {
  width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
  display: grid; place-items: center; background: var(--card); border: 1px solid var(--line);
  font-weight: 650; font-size: 24px; letter-spacing: .02em;
}
h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.title { margin: 6px 0 0; color: var(--muted); text-wrap: balance; }
nav { display: grid; gap: 12px; }
.btn {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 18px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; text-align: left;
  -webkit-tap-highlight-color: transparent; transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.status { min-height: 1.5em; margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">MA</div>
    <h1>Michael Al Kurdi</h1>
    <p class="title">Cybersecurity &amp; AI Systems · Security+</p>
  </header>
  <nav aria-label="Contact">
    <a class="btn primary" href="contact.vcf"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>Save my contact</span></a>
    <a class="btn" href="https://www.linkedin.com/in/mahmoud-michael-al-kurdi/" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg><span>LinkedIn</span></a>
    <a class="btn" href="https://km-it-ops.github.io/" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span>Website</span></a>
    <a class="btn" href="mailto:kurdi.michael.it@gmail.com"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Email</span></a>
    <button class="btn" type="button" id="share"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Share this card</span></button>
  </nav>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
document.getElementById("share").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const url = location.href.split("#")[0];
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); status.textContent = "Link copied"; }
  catch { status.textContent = url; }
});
</script>
</body>
</html>
